<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0F12" />
    <link rel="manifest" href="/fit-routine-tracker/manifest.json" />
    <title>Rutinitas & Latihan Harian</title>
  </head>
  <body style="background-color: #0D0F12; margin: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/fit-routine-tracker/sw.js", {
              scope: "/fit-routine-tracker/",
            })
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
